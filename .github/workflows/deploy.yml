name: Deploy UI5 App to GitHub Pages

# Publica o `dist` com as actions OFICIAIS do GitHub Pages (upload-pages-artifact
# + deploy-pages). Requer, uma unica vez, em Settings > Pages > Build and
# deployment > Source: "GitHub Actions".
#
# Por que nao publicar numa branch gh-pages: nesse modo o Pages passa os
# arquivos pelo Jekyll, que IGNORA pastas e arquivos iniciados por "_" - e o
# bundle do jsPDF tem `thirdparty/_dynamics/` e `_commonjsHelpers.js`. O PDF
# quebraria no site publicado. O artefato do deploy-pages e servido como esta.
#
# Os certificados (Credly) e repositorios (GitHub) sao buscados AQUI, no build,
# e nao no navegador: o credly.com nao envia CORS. O agendamento diario
# republica o site para badges e estrelas novas aparecerem sozinhas. (O commit
# do sync-content.yml usa [skip ci] e nao dispara este workflow.)

on:
    push:
        branches:
            - main
    schedule:
        # 06:30 UTC (03:30 no Brasil), depois do sync-content.yml.
        - cron: "30 6 * * *"
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

# Um deploy de cada vez; um novo push cancela o build anterior ainda em curso.
concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            # Falha de rede/limite em uma das fontes nao derruba o deploy: o JSON
            # versionado em webapp/content continua valendo.
            - name: Sync GitHub data
              continue-on-error: true
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: npm run sync:github

            - name: Scrape Credly certificates
              continue-on-error: true
              run: npm run scrape:certificates

            - name: Validate content
              run: npm run content:check

            # PDF estatico (webapp/cv/ esta no .gitignore). O botao "Ver PDF" gera
            # o arquivo na hora no navegador; este e a alternativa se isso falhar.
            - name: Generate CV PDF
              run: npm run cv:pdf

            - name: Build UI5 Project (Transpile TS to JS)
              run: npm run build

            # Seguro extra caso o Pages volte a ser servido por branch.
            - name: Disable Jekyll
              run: touch dist/.nojekyll

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: dist

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
