<!doctype html>
<html lang="pt-BR" data-theme="light">
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5" />
        <title>Davi Castro | SAP Developer &amp; UI5</title>
        <meta
            name="description"
            content="Portfólio de Davi Castro - Consultor SAP ABAP, SAP Fiori, SAPUI5, RAP, CAP, SAP BTP, MDK e mais."
        />
        <meta name="author" content="Davi Castro" />
        <!-- Cor da barra do navegador no mobile: a paleta do portfolio, nao o azul SAP. -->
        <meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)" />
        <meta name="theme-color" content="#0c1412" media="(prefers-color-scheme: dark)" />

        <!-- OpenGraph / Twitter: definem o card de pré-visualização ao compartilhar o link -->
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="Davi Castro | Portfólio" />
        <meta
            property="og:title"
            content="Davi Castro | SAP Developer - ABAP, Fiori, UI5, RAP, CAP, BTP, MDK +"
        />
        <meta
            property="og:description"
            content="Consultor SAP ABAP com atuação em S/4HANA, SAP Fiori, SAPUI5, RAP, CAP, SAP BTP, SAP Build, MDK e mais."
        />
        <meta property="og:url" content="https://davicastr.github.io/SAP-UI5-Portfolio/" />
        <meta property="og:image" content="images/og-cover.png" />
        <meta property="og:locale" content="pt_BR" />
        <meta property="og:locale:alternate" content="en_US" />
        <meta name="twitter:card" content="summary_large_image" />
        <meta
            name="twitter:title"
            content="Davi Castro | SAP Developer - ABAP, Fiori, UI5, RAP, CAP, BTP, MDK +"
        />
        <meta name="twitter:description" content="Portfólio SAPUI5 + TypeScript de Davi Castro." />
        <meta name="twitter:image" content="images/og-cover.png" />

        <link rel="icon" href="images/favicon.svg" type="image/svg+xml" />
        <link rel="apple-touch-icon" href="images/favicon.svg" />

        <!--
        IMPORTANTE: nao use <base href="..."> aqui.

        O <base> fixa a resolucao de TODAS as URLs relativas da pagina. Com
        <base href="/SAP-UI5-Portfolio/">, abrir a app em http://localhost:8080/
       /index.html faria o UI5 procurar manifest.json em /SAP-UI5-Portfolio/
        (404) e a tela ficaria presa no preloader.

        Sem <base>, o "./" do data-sap-ui-resourceroots e resolvido a partir da
        propria pagina, e a app funciona tanto na raiz do servidor quanto em
        subpasta (GitHub Pages: /SAP-UI5-Portfolio/).
    -->

        <!--
        Bootstrap dinamico: o tema (claro/escuro) e aplicado ANTES do sap-ui-core carregar,
        evitando qualquer "flash" de tema ao abrir a pagina.
    -->
        <script>
            (function () {
                var STORAGE_KEY = "davi-portfolio.theme";
                var THEMES = { light: "sap_horizon", dark: "sap_horizon_dark" };
                var stored = null;
                try {
                    stored = localStorage.getItem(STORAGE_KEY);
                } catch (oError) {
                    stored = null;
                }
                var theme = THEMES[stored] || THEMES.light;
                document.documentElement.setAttribute("data-theme", THEMES[stored] ? stored : "light");

                var params = new URLSearchParams(window.location.search);
                var requested = params.get("lang") || params.get("locale");
                var browserLang = (navigator.language || "pt-BR").toLowerCase();
                // Mesma regra do LocaleResolver do app: ?lang= > navegador > pt.
                var lang = (requested || (browserLang.indexOf("en") === 0 ? "en" : "pt")).toLowerCase();
                document.documentElement.setAttribute("lang", lang === "en" ? "en" : "pt-BR");

                var bootstrap = document.createElement("script");
                bootstrap.id = "sap-ui-bootstrap";
                bootstrap.src = "https://ui5.sap.com/1.153.0/resources/sap-ui-core.js";
                bootstrap.setAttribute("data-sap-ui-theme", theme);
                bootstrap.setAttribute("data-sap-ui-async", "true");
                bootstrap.setAttribute("data-sap-ui-compatVersion", "edge");
                bootstrap.setAttribute("data-sap-ui-frameOptions", "trusted");
                bootstrap.setAttribute("data-sap-ui-oninit", "module:sap/ui/core/ComponentSupport");
                bootstrap.setAttribute("data-sap-ui-animation", "false");
                bootstrap.setAttribute(
                    "data-sap-ui-resourceroots",
                    // "jspdf": no `ui5 serve` o import fica como "jspdf" e o
                    // middleware o expoe em ./resources/jspdf.js; sem este
                    // mapeamento o loader o buscaria no CDN. No build o import ja
                    // vira "davi/portfolio/thirdparty/jspdf" e isto nao e usado.
                    JSON.stringify({ "davi.portfolio": "./", jspdf: "./resources/jspdf" })
                );
                bootstrap.setAttribute("data-sap-ui-language", lang);
                document.head.appendChild(bootstrap);
            })();
        </script>

        <style>
            html,
            body,
            body > div,
            #app,
            #app-uiarea {
                height: 100%;
            }
            body {
                margin: 0;
                /* tokens.css e a fonte da verdade da paleta; o fallback cobre
                 * a janela antes de o UI5 injetar o CSS do componente. */
                background: var(--pf-bg, #f6f5f2);
                font-family: "72", "Segoe UI", Arial, sans-serif;
            }
            html[data-theme="dark"] body {
                background: var(--pf-bg, #0c1412);
            }

            /* Splash exibido enquanto o UI5 carrega o conteudo */
            .pf-splash {
                position: fixed;
                inset: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 20px;
                background:
                    radial-gradient(120% 90% at 82% 12%, rgba(245, 158, 11, 0.22) 0%, transparent 55%),
                    linear-gradient(135deg, #062b26 0%, #0a4a3f 48%, #0e7c6b 100%);
                color: #fff;
                z-index: 999;
                transition: opacity 0.35s ease;
            }
            .pf-splash.is-hidden {
                opacity: 0;
                pointer-events: none;
            }
            .pf-splash__name {
                font-size: 20px;
                font-weight: 700;
                letter-spacing: 0.02em;
            }
            .pf-splash__role {
                font-size: 13px;
                opacity: 0.85;
            }
            .pf-splash__bar {
                width: 180px;
                height: 3px;
                border-radius: 2px;
                background: rgba(255, 255, 255, 0.3);
                overflow: hidden;
            }
            .pf-splash__bar::after {
                content: "";
                display: block;
                width: 45%;
                height: 100%;
                border-radius: 2px;
                background: #fff;
                animation: pf-splash-slide 1.1s ease-in-out infinite;
            }
            @keyframes pf-splash-slide {
                0% {
                    transform: translateX(-100%);
                }
                100% {
                    transform: translateX(320%);
                }
            }
        </style>
    </head>
    <body class="sapUiBody sapUiSizeCompact">
        <div class="pf-splash" id="pf-splash">
            <div class="pf-splash__name">Davi Castro</div>
            <div class="pf-splash__role">
                SAP Developer &middot; ABAP &middot; Fiori &middot; UI5 &middot; RAP &middot; CAP &middot; BTP
                &middot; MDK &middot; +
            </div>
            <div class="pf-splash__bar"></div>
        </div>

        <div
            data-sap-ui-component
            data-name="davi.portfolio"
            data-id="app"
            data-settings='{ "id": "davi.portfolio" }'
            data-handle-validation="true"
        ></div>

        <script>
            // Rede de seguranca: se o component nao conseguir carregar (404, CDN
            // bloqueado, erro de sintaxe no bundle), o splash some sozinho e o
            // usuario ve a orientacao em vez de uma tela carregando para sempre.
            // Só acusa falha quando NADA foi renderizado no container do component.
            (function () {
                var TIMEOUT = 20000;
                var POLL = 500;
                var container = document.querySelector("[data-sap-ui-component]");

                var hide = function () {
                    var splash = document.getElementById("pf-splash");
                    if (splash && splash.parentNode) {
                        splash.parentNode.removeChild(splash);
                    }
                };

                var deadline = Date.now() + TIMEOUT;
                var poll = function () {
                    if (container && container.children.length > 0) {
                        hide();
                        return;
                    }
                    if (Date.now() >= deadline) {
                        var splash = document.getElementById("pf-splash");
                        if (splash && splash.parentNode) {
                            splash.innerHTML =
                                '<div class="pf-splash__name">Não foi possível iniciar a aplicação</div>' +
                                '<div class="pf-splash__role">Verifique o console do navegador (F12) para ver o erro detalhado.</div>' +
                                '<div class="pf-splash__role">Confirme que index.html e manifest.json estão na mesma pasta e que o componente "davi.portfolio" foi compilado.</div>';
                        }
                        return;
                    }
                    window.setTimeout(poll, POLL);
                };

                window.setTimeout(poll, POLL);
            })();
        </script>
    </body>
</html>
